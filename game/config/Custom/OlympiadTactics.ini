# Tactical skill selection in ranked Olympiad. Restart GameServer after changing Enabled.
# No speed, damage, skill-success or resource multipliers are added by difficulty.
Enabled = true
# normal | experienced | strong. GM can change through Giran's Server Guide.
DefaultDifficulty = strong

# Disable NEW sparring sessions only. Recovery stays active. Restart GameServer.
TrainingEnabled = true

# Self-buff preparation AFTER core duel starts; allowed range 10..60 seconds (default 10).
TrainingPreparationSeconds = 10
# Training bots are level 85 and use the ranked gear/skill-enchant settings.
# Human skill cooldowns reset ONCE after acknowledged arena entry, never on exit.
# Bot short-duration openers are applied once around 3s before combat, not reapplied.
# Leaving stops offense but safe return waits for core duel completion (remaining 120s limit).
